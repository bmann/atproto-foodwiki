name: check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck packages
        run: |
          npx tsc -p packages/core/tsconfig.json --noEmit
          npx tsc -p packages/lexicons/tsconfig.json --noEmit
          npx tsc -p packages/web/tsconfig.json --noEmit
      - name: Build web app
        run: npm run build -w @foodwiki/web
