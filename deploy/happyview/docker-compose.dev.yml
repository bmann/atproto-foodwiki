# Local HappyView dev instance (SQLite) built from upstream v2.13.0 source.
# Usage: docker compose -f deploy/happyview/docker-compose.dev.yml up --build -d
name: foodwiki-happyview
services:
  happyview:
    build:
      context: /tmp/happyview-src   # upstream source (git clone v2.13.0)
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: sqlite://data/happyview.db?mode=rwc
      PUBLIC_URL: http://127.0.0.1:3000
      SESSION_SECRET: dev-session-secret-0123456789abcdef0123456789abcdef
      PORT: "3000"
      STATIC_DIR: /srv/static
    volumes:
      - happyview-data:/app/data
volumes:
  happyview-data:
